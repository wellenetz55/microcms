name: Check Xserver SSH connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH authentication
        env:
          PRIVATE_KEY: ${{ secrets.XSERVER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.XSERVER_KNOWN_HOSTS }}
          XSERVER_SSH_PASSPHRASE: ${{ secrets.XSERVER_SSH_PASSPHRASE }}
        run: |
          umask 077
          test -n "$PRIVATE_KEY" && test -n "$KNOWN_HOSTS"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/xserver.key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/xserver.known_hosts"
          eval "$(ssh-agent -a "$RUNNER_TEMP/xserver-agent.sock" -s)" > /dev/null
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/xserver-askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "${XSERVER_SSH_PASSPHRASE:-}"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/xserver-askpass"
          if ! DISPLAY=:0 SSH_ASKPASS_REQUIRE=force SSH_ASKPASS="$RUNNER_TEMP/xserver-askpass" ssh-add "$RUNNER_TEMP/xserver.key" < /dev/null > /dev/null 2>&1; then
            echo 'SSH key could not be unlocked. Check the private key and passphrase Secrets.' >&2
            exit 1
          fi
          ssh-add -L > "$RUNNER_TEMP/xserver.key.pub"
      - name: Inspect server without changing files
        env:
          XSERVER_HOST: ${{ vars.XSERVER_HOST }}
          XSERVER_USER: ${{ vars.XSERVER_USER }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re, shlex, subprocess, time
          host=os.environ['XSERVER_HOST']
          user=os.environ['XSERVER_USER']
          if not re.fullmatch(r'[A-Za-z0-9.-]+',host) or not re.fullmatch(r'[A-Za-z0-9_-]+',user):
              raise SystemExit('Invalid SSH host or user')
          runner=pathlib.Path(os.environ['RUNNER_TEMP'])
          ssh=['ssh','-v','-p','10022','-i',str(runner/'xserver.key'),'-o','BatchMode=yes','-o','PreferredAuthentications=publickey','-o','IdentitiesOnly=yes','-o','ConnectTimeout=15','-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(runner/'xserver.known_hosts')]
          remote_script="import json, os, pathlib, shutil, sys\nhome=pathlib.Path.home()\nroot=home/'wellenetz.co.jp'/'public_html'\nresult={'home':str(home),'public_directory':str(root.resolve()),'public_directory_exists':root.is_dir(),'python_version':sys.version.split()[0],'rsync_available':bool(shutil.which('rsync')),'index_html_exists':(root/'index.html').is_file(),'index_php_exists':(root/'index.php').is_file(),'htaccess_exists':(root/'.htaccess').is_file(),'root_is_symlink':root.is_symlink()}\nprint(json.dumps(result,ensure_ascii=False,indent=2))\nif not root.is_dir() or not shutil.which('rsync') or sys.version_info < (3,8):\n    sys.exit(1)\n"
          for attempt in range(3):
              result=subprocess.run(ssh+[user+'@'+host,'python3 -c '+shlex.quote(remote_script)],capture_output=True,text=True,timeout=45)
              if result.returncode and 'Connection timed out' in result.stderr and attempt < 2:
                  print('SSH connection timed out; retrying temporary network failure',flush=True)
                  time.sleep(3)
                  continue
              break
          print(result.stdout)
          if result.returncode:
              print('SSH exit status:',result.returncode)
              # OpenSSH -v reports protocol metadata, never private key or passphrase contents.
              print(result.stderr)
              raise SystemExit('SSH verification failed; no server files were changed')
          PYTHON
      - name: Remove temporary credentials
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k > /dev/null || true; fi
          rm -f "$RUNNER_TEMP/xserver.key.pub" "$RUNNER_TEMP/xserver.key" "$RUNNER_TEMP/xserver.known_hosts" "$RUNNER_TEMP/xserver-askpass"
