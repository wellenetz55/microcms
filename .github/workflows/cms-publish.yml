name: Publish microCMS to Xserver
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'sample: 接続不要の生成テスト / published: microCMS公開記事'
        type: choice
        options: [sample, published]
        default: sample
        required: true
  repository_dispatch:
    types: [microcms_build]
permissions:
  contents: read
concurrency:
  group: wellenetz-cms-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pipeline tests
        run: python3 -m unittest discover -s cms/tests -v
      - name: Fetch published content and build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ vars.MICROCMS_SERVICE_DOMAIN || 'wellenetz' }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          BUILD_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'published' }}
        run: |
          if [ "$BUILD_SOURCE" = "sample" ]; then
            python3 cms/pipeline.py --fixture --output cms-output/release
          else
            python3 cms/pipeline.py --output cms-output/release
          fi
      - name: Save generated files for review or manual upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'sample' && 'wellenetz-preview' || 'wellenetz-production' }}
          path: cms-output/release/
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: build
    if: vars.CMS_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.source == 'published')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wellenetz-production
          path: cms-output/release
      - name: Prepare SSH authentication
        env:
          PRIVATE_KEY: ${{ secrets.XSERVER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.XSERVER_KNOWN_HOSTS }}
          XSERVER_SSH_PASSPHRASE: ${{ secrets.XSERVER_SSH_PASSPHRASE }}
        run: |
          umask 077
          test -n "$PRIVATE_KEY" && test -n "$KNOWN_HOSTS"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/xserver.key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/xserver.known_hosts"
          eval "$(ssh-agent -a "$RUNNER_TEMP/xserver-agent.sock" -s)" > /dev/null
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/xserver-askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "${XSERVER_SSH_PASSPHRASE:-}"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/xserver-askpass"
          if ! DISPLAY=:0 SSH_ASKPASS_REQUIRE=force SSH_ASKPASS="$RUNNER_TEMP/xserver-askpass" ssh-add "$RUNNER_TEMP/xserver.key" < /dev/null > /dev/null 2>&1; then
            echo 'SSH key could not be unlocked. Check the private key and passphrase Secrets.' >&2
            exit 1
          fi
          ssh-add -L > "$RUNNER_TEMP/xserver.key.pub"
      - name: Publish verified release
        env:
          XSERVER_HOST: ${{ vars.XSERVER_HOST }}
          XSERVER_USER: ${{ vars.XSERVER_USER }}
          XSERVER_PUBLIC_DIR: ${{ vars.XSERVER_PUBLIC_DIR }}
          XSERVER_KEY_FILE: ${{ runner.temp }}/xserver.key
          XSERVER_KNOWN_HOSTS_FILE: ${{ runner.temp }}/xserver.known_hosts
        run: python3 cms/deploy.py --release cms-output/release --apply
      - name: Remove temporary credentials
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k > /dev/null || true; fi
          rm -f "$RUNNER_TEMP/xserver.key.pub" "$RUNNER_TEMP/xserver.key" "$RUNNER_TEMP/xserver.known_hosts" "$RUNNER_TEMP/xserver-askpass"
