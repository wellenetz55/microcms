name: Build microCMS for Xserver pull
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'sample: 接続不要の生成テスト / published: microCMS公開記事'
        type: choice
        options: [sample, published]
        default: sample
        required: true
  repository_dispatch:
    types: [microcms_build]
permissions:
  contents: read
concurrency:
  group: wellenetz-cms-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pipeline tests
        run: python3 -m unittest discover -s cms/tests -v
      - name: Fetch published content and build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ vars.MICROCMS_SERVICE_DOMAIN || 'wellenetz' }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          BUILD_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'published' }}
        run: |
          if [ "$BUILD_SOURCE" = "sample" ]; then
            python3 cms/pipeline.py --fixture --output cms-output/release
          else
            python3 cms/pipeline.py --output cms-output/release
          fi
      - name: Save generated files for review or manual upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'sample' && 'wellenetz-preview' || 'wellenetz-production' }}
          path: cms-output/release/
          retention-days: 7
          if-no-files-found: error
  release:
    needs: build
    if: vars.CMS_RELEASE_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.source == 'published')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wellenetz-production
          path: cms-output/release
      - name: Package verified static files only
        run: python3 cms/package_release.py --release cms-output/release --output cms-output/wellenetz-site.zip
      - name: Publish complete package for HTTPS retrieval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: cms-production-${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" cms-output/wellenetz-site.zip --target "$TARGET_COMMIT" --draft --title "$RELEASE_TAG" --notes 'Verified public website files for Wellenetz. Server-side activation is controlled separately.'
          gh release edit "$RELEASE_TAG" --draft=false --latest
